<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 15px;
            background-color: rgb(170, 173, 197) ;
        }
        header{
            text-align: center;
        }
        section{
            background-color: #c7cace;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }    
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 150px;
            width: 150px;
            padding: 0px;
        }
        input[type="submit"]{
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>MOVIE RATINGS</h1>
        <br>
        <p>Write and share honest reviews about your favorite movies here.</p>
    </header>
    <br>

    <section>
        <form action="">
            <img src="https://png.pngtree.com/png-vector/20190816/ourmid/pngtree-film-logo-design-template-vector-isolated-illustration-png-image_1693431.jpg" alt="movie film logo">
            <br>

            <br>
            <label for="movie">Movie Title</label>
            <br>

            <input type="text" id="movie" name="movie"placeholder="Enter here.">
            
            <br>

            <label for="">Genres:</label>
            <br>
            <input type="checkbox" id="genre1" name="genre1">
            <label for="genre1">Action</label>

            <input type="checkbox" id="genre2" name="genre2">
            <label for="genre2">Drama</label>
            
            <input type="checkbox" id="genre3" name="genre3">
            <label for="genre3">Romance</label>
            
            <input type="checkbox" id="genre4" name="genre4">
            <label for="genre4">Comedy</label>
            
            <input type="checkbox" id="genre5" name="genre5">
            <label for="genre5">Thriller</label>
            
            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate 1" name="rate">
            <label for="rate 1">⭐</label> 

            <input type="radio" id="rate 2" name="rate">
            <label for="rate 2">⭐⭐</label> 

            <input type="radio" id="rate 3" name="rate">
            <label for="rate 3">⭐⭐⭐</label> 

            <input type="radio" id="rate 4" name="rate">
            <label for="rate 4">⭐⭐⭐⭐</label> 

            <input type="radio" id="rate 5" name="rate">
            <label for="rate 5">⭐⭐⭐⭐⭐</label> 
            <br>
            
           <br>
           <textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
           <br>
           
           <input type="submit" id="submit" value="Submit Review">
           <br>
           
           Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="">here</a> for the guide in making a review.
           
        </form>
    </section>

	<!--Nailong is so cute--!>
    <!--Reference
	Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
-->
	<p>Coded by: Kaitlin Mediarito</p>
</body>
</html>
